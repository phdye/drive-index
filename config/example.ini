# drive-index: an example holding one of each kind of entry.
#
# Only what differs from the built-in defaults belongs here. A single-letter
# label is a drive and needs nothing at all: its root is /<letter>/ and its
# database comes from db_file_model. So c, d and z work with this file absent
# entirely, and `drive-index install c` makes the symlinks for one.
#
# Anything that is not a drive letter has to be described before it will run,
# since there is nothing to guess from.
#
# Precedence runs command-line option, then DRIVE_INDEX_* in the environment,
# then this file, then the default. Prune paths are one per line, indented,
# and cannot contain whitespace: updatedb takes them as a single
# whitespace-separated list and has no escaping form, so a path holding a
# space would be read as two that match nothing.

[defaults]
# {name}, {host} and {os} are the fields. Scoping by host matters when an
# index built elsewhere is copied in beside locally built ones.
db_file_model = /var/mlocate/{name}.db

#--------------------------------------------------------------- a plain drive
# Root and database are both defaults here; only the prune set differs.
# A path that does not exist prunes nothing and is reported as such.
[drive.c]
add_prunepaths =
	/c/tmp
	/c/var/cache

#------------------------------------------------------------ a removable disk
# removable says an absent root is normal, so a bulk rebuild passes over it
# quietly rather than reporting a fault.
#
# volume names what this index describes. Before a build, <root>/.volume-id is
# read and compared, so a disk mounted where another one used to be cannot be
# indexed under its predecessor's name. It needs the root writable once, to
# place the marker.
[drive.d]
removable = yes
volume = backup-red

#--------------------------------------------------------- an imported index
# Built on another machine and copied here. Having no root is what marks it:
# it can be searched but never built, and gets no updatedb symlink at all.
# Without that, one build would replace another machine's filesystem with a
# scan of a path that does not exist on this one.
[drive.archive]
alias = old-backup
database = /var/mlocate/archive-host/archive.db

#------------------------------------------------- something that is not a disk
# A subtree indexed under a name of its own, because a scoped search is far
# faster than filtering the whole drive. Its files are in drive c's index too,
# so a search with --all-indexes reports them twice.
[drive.src]
root = /c/src/

#------------------------------------------------------- volatile, on demand
# bulk = no keeps an entry out of a sweep. Some trees change faster than any
# index of them can stay true, and are worth having on request rather than on
# a schedule.
[drive.volatile]
root = /c/var/run/
bulk = no

#------------------------------------------- several environments, one prefix
# app-locate searches all three; app-locate --prod searches one; --dev --test
# searches two. app-updatedb builds all three, in the order listed here.
#
# Every member is the default for both verbs. Indexing only reads a root, so
# building more than was meant costs time rather than damage, while searching
# fewer than was meant produces a finding about the wrong system and says
# nothing about it. Narrowing is what gets announced.
#
# A selector may not be an option of drive-index or of locate, and may not
# name another group. All of that is refused when this file is read.
[group.app]
default = all
member.dev  = x
member.test = y
member.prod = z
